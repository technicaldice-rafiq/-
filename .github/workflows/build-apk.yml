name: Build Rahima Traders APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create Android project
        run: |
          mkdir -p android/app/src/main/java/com/rahimatraders/app
          mkdir -p android/app/src/main/res/values
          mkdir -p android/app/src/main/res/drawable

          cat > android/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "RahimaTraders"
          include(":app")
          EOF

          cat > android/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > android/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.rahimatraders.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.rahimatraders.app'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

          cat > android/app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#075e54</item>
                  <item name="android:statusBarColor">#075e54</item>
                  <item name="android:navigationBarColor">#075e54</item>
              </style>
          </resources>
          EOF

          cat > android/app/src/main/res/drawable/ic_launcher.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="48dp"
              android:height="48dp"
              android:viewportWidth="48"
              android:viewportHeight="48">
              <path
                  android:fillColor="#075e54"
                  android:pathData="M0,0h48v48h-48z"/>
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M10,20h28v18h-28zM8,20l16,-10 16,10zM20,26h8v12h-8z"/>
          </vector>
          EOF

          cat > android/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET"/>

              <application
                  android:theme="@style/AppTheme"
                  android:label="M/S Rahima Traders"
                  android:icon="@drawable/ic_launcher">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > android/app/src/main/java/com/rahimatraders/app/MainActivity.java <<'EOF'
          package com.rahimatraders.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.content.Intent;
          import android.net.Uri;

          public class MainActivity extends Activity {

              WebView web;

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  web = new WebView(this);
                  setContentView(web);

                  WebSettings settings = web.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  
                  settings.setCacheMode(WebSettings.LOAD_NO_CACHE);
                  web.clearCache(true);
                  web.clearHistory();
                  web.setWebChromeClient(new WebChromeClient());

                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(
                              WebView view,
                              WebResourceRequest request) {

                          Uri uri = request.getUrl();
                          String url = uri.toString();

                          if (url.startsWith("tel:")
                                  || url.startsWith("whatsapp:")
                                  || url.startsWith("https://wa.me/")) {

                              try {
                                  startActivity(
                                      new Intent(Intent.ACTION_VIEW, uri)
                                  );
                              } catch (Exception ignored) {}

                              return true;
                          }

                          return false;
                      }
                  });

                  web.loadUrl(
                      "https://technicaldice-rafiq.github.io/-/app.html"
                  );
              }

              @Override
              public void onBackPressed() {
                  if (web.canGoBack()) {
                      web.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Gradle Wrapper
        working-directory: android
        run: gradle wrapper --gradle-version 8.9

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Rahima-Traders-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
