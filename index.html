<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>M/S Rahima Traders</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,"Noto Sans Bengali",sans-serif;
  background:#f3f6f8;
  color:#222;
}

header{
  background:linear-gradient(135deg,#075e54,#128c7e);
  color:white;
  padding:30px 18px;
  text-align:center;
}

header h1{
  margin:0;
  font-size:28px;
}

header p{
  margin:10px 0 0;
  font-size:16px;
}

.container{
  max-width:700px;
  margin:auto;
  padding:15px;
}

.card{
  background:white;
  margin:15px 0;
  padding:20px;
  border-radius:16px;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.card h2{
  margin-top:0;
  color:#075e54;
}

.products{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.product{
  border:1px solid #ddd;
  padding:18px 10px;
  border-radius:14px;
  text-align:center;
}

.product .icon{
  font-size:42px;
}

.product h3{
  margin:8px 0;
}

.product p{
  color:#666;
  font-size:14px;
  line-height:1.7;
}

label{
  display:block;
  margin-top:12px;
  margin-bottom:6px;
  font-weight:bold;
}

input,
select,
textarea{
  width:100%;
  padding:13px;
  border:1px solid #ccc;
  border-radius:10px;
  font-size:16px;
  background:white;
}

textarea{
  min-height:90px;
  resize:vertical;
}

button{
  display:block;
  width:100%;
  padding:14px;
  margin-top:18px;
  border:none;
  border-radius:10px;
  background:#075e54;
  color:white;
  font-size:17px;
}

.contact-btn{
  display:block;
  width:100%;
  padding:14px;
  margin-top:12px;
  border-radius:10px;
  text-align:center;
  color:white;
  text-decoration:none;
  font-size:17px;
}

.call{
  background:#1976d2;
}

.whatsapp{
  background:#25D366;
}

.info{
  background:#fff8e1;
  border-left:5px solid #ff9800;
  padding:12px;
  border-radius:8px;
  margin-top:15px;
  line-height:1.6;
}

footer{
  text-align:center;
  padding:25px;
  color:#666;
  font-size:14px;
}

.success{
  display:none;
  margin-top:15px;
  padding:15px;
  background:#e8f5e9;
  border-left:5px solid #2e7d32;
  border-radius:8px;
}

@media(max-width:500px){

  .products{
    grid-template-columns:1fr;
  }

  header h1{
    font-size:25px;
  }

}
</style>
</head>

<body>

<header>

<h1>🏪 M/S Rahima Traders</h1>

<p>
পাটগ্রাম থেকে ঢাকা ও আশেপাশে পাথর-বালু সরবরাহ
</p>

</header>


<div class="container">


<!-- আমাদের পণ্য -->

<div class="card">

<h2>🛒 আমাদের পণ্য</h2>
