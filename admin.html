<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>M/S Rahima Traders - Admin</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,"Noto Sans Bengali",sans-serif;
background:#f3f6f8;
color:#222;
}

header{
background:#075e54;
color:white;
padding:20px;
text-align:center;
}

header h1{
margin:0;
font-size:24px;
}

.container{
max-width:1100px;
margin:auto;
padding:15px;
}

.card{
background:white;
padding:18px;
margin:15px 0;
border-radius:14px;
box-shadow:0 3px 12px rgba(0,0,0,.08);
}

input,select{
width:100%;
padding:12px;
margin:6px 0;
border:1px solid #ccc;
border-radius:8px;
font-size:16px;
}

button{
padding:11px 15px;
border:0;
border-radius:8px;
background:#075e54;
color:white;
font-size:15px;
cursor:pointer;
margin:4px;
}

.refresh{
background:#1976d2;
}

.logout{
background:#d32f2f;
}

.detailsBtn{
background:#6a1b9a;
}

.callBtn{
background:#388e3c;
}

.whatsappBtn{
background:#25d366;
}

.stats{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:12px;
}

.stat{
background:white;
padding:18px;
border-radius:12px;
text-align:center;
box-shadow:0 3px 10px rgba(0,0,0,.07);
}

.stat h3{
margin:5px 0;
font-size:28px;
}

.stat p{
margin:0;
font-weight:bold;
}

.new{
border-top:5px solid #ff9800;
}

.delivery{
border-top:5px solid #9c27b0;
}

.completed{
border-top:5px solid #4caf50;
}

.hidden{
display:none;
}

#loginMessage{
color:#d32f2f;
margin-top:10px;
}

.tableWrap{
overflow-x:auto;
}

table{
width:100%;
border-collapse:collapse;
margin-top:15px;
font-size:14px;
min-width:1050px;
}

th,td{
border:1px solid #ddd;
padding:9px;
text-align:left;
}

th{
background:#075e54;
color:white;
}

.status{
padding:7px;
margin:0;
}

.orderCount{
font-weight:bold;
margin-top:10px;
}

.detailsBox{
background:#f7f7f7;
border-radius:10px;
padding:15px;
margin-top:10px;
border-left:5px solid #6a1b9a;
}

.detailsBox h3{
margin-top:0;
color:#6a1b9a;
}

.detailLine{
padding:6px 0;
border-bottom:1px solid #ddd;
}

.detailLabel{
font-weight:bold;
}

.actionButtons{
margin-top:10px;
}

@media(max-width:700px){

.stats{
grid-template-columns:repeat(2,1fr);
}

.stat h3{
font-size:23px;
}

header h1{
font-size:20px;
}

.card{
padding:14px;
}

}
</style>
</head>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,

);

/* LOGIN */

async function login(){

const email =
document
.getElementById("adminEmail")
.value
.trim();


const password =
document
.getElementById("adminPassword")
.value;


if(!email || !password){

document
.getElementById("loginMessage")
.innerText =
"Email এবং Password দিন।";

return;

}


const {data,error} =
await supabaseClient
.auth
.signInWithPassword({

email:email,

password:password

});


if(error){

document
.getElementById("loginMessage")
.innerText =
error.message;

return;

}


document
.getElementById("loginBox")
.classList
.add("hidden");


document
.getElementById("adminPanel")
.classList
.remove("hidden");


loadOrders();

}


/* LOGOUT */

async function logout(){

await supabaseClient
.auth
.signOut();

location.reload();

}


/* LOAD ORDERS */

async function loadOrders(){

const area =
document
.getElementById("orderArea");


area.innerHTML =
"⏳ অর্ডার লোড হচ্ছে...";


const {data,error} =
await supabaseClient

.from("orders")

.select("*")

.order(
"created_at",
{ascending:false}
);


if(error){

area.innerHTML =
"❌ অর্ডার লোড হয়নি: " +
error.message;

return;

}


allOrders =
data || [];


updateDashboard();


displayOrders(allOrders);

}


/* DASHBOARD */

function updateDashboard(){

const total =
allOrders.length;


const newCount =
allOrders.filter(
o => o.status === "নতুন"
).length;


const deliveryCount =
allOrders.filter(
o => o.status === "ডেলিভারি"
).length;


const completedCount =
allOrders.filter(
o => o.status === "সম্পন্ন"
).length;


document
.getElementById("totalOrders")
.innerText =
total;


document
.getElementById("newOrders")
.innerText =
newCount;


document
.getElementById("deliveryOrders")
.innerText =
deliveryCount;


document
.getElementById("completedOrders")
.innerText =
completedCount;

}

function filterOrders(){

const search =
document
.getElementById("searchBox")
.value
.toLowerCase()
.trim();


const status =
document
.getElementById("statusFilter")
.value;


const filtered =
allOrders.filter(order => {

const text = (

(order.order_no || "") +
" " +
(order.customer_name || "") +
" " +
(order.phone || "") +
" " +
(order.product || "") +
" " +
(order.type || "") +
" " +
(order.delivery_location || "")

).toLowerCase();


const searchMatch =
!search ||
text.includes(search);


const statusMatch =
status === "সব" ||
order.status === status;


return searchMatch && statusMatch;

});


displayOrders(filtered);

}
