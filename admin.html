<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>M/S Rahima Traders - Admin</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,"Noto Sans Bengali",sans-serif;
background:#f3f6f8;
color:#222;
}

header{
background:#075e54;
color:white;
padding:20px;
text-align:center;
}

header h1{
margin:0;
font-size:24px;
}

.container{
max-width:1100px;
margin:auto;
padding:15px;
}

.card{
background:white;
padding:18px;
margin:15px 0;
border-radius:14px;
box-shadow:0 3px 12px rgba(0,0,0,.08);
}

input,select{
width:100%;
padding:12px;
margin:6px 0;
border:1px solid #ccc;
border-radius:8px;
font-size:16px;
}

button{
padding:12px 16px;
border:0;
border-radius:8px;
background:#075e54;
color:white;
font-size:16px;
cursor:pointer;
margin:5px 0;
}

.logout{
background:#d32f2f;
}

.refresh{
background:#1976d2;
}

.stats{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:12px;
}

.stat{
background:white;
padding:18px;
border-radius:12px;
text-align:center;
box-shadow:0 3px 10px rgba(0,0,0,.07);
}

.stat h3{
margin:5px 0;
font-size:28px;
}

.stat p{
margin:0;
font-weight:bold;
}

.new{
border-top:5px solid #ff9800;
}

.delivery{
border-top:5px solid #9c27b0;
}

.completed{
border-top:5px solid #4caf50;
}

.hidden{
display:none;
}

#loginMessage{
color:#d32f2f;
margin-top:10px;
}

table{
width:100%;
border-collapse:collapse;
margin-top:15px;
font-size:14px;
min-width:950px;
}

th,td{
border:1px solid #ddd;
padding:9px;
text-align:left;
}

th{
background:#075e54;
color:white;
}

.status{
padding:7px;
margin:0;
}

.orderCount{
font-weight:bold;
margin-top:10px;
}

.tableWrap{
overflow-x:auto;
}

@media(max-width:700px){

.stats{
grid-template-columns:repeat(2,1fr);
}

.stat h3{
font-size:23px;
}

header h1{
font-size:20px;
}

.card{
padding:14px;
}

}

</style>
</head>

<body>

<header>

<h1>🔐 M/S Rahima Traders</h1>

<p>Admin Dashboard</p>

</header>


<div class="container">


<!-- LOGIN -->

<div id="loginBox" class="card">

<h2>🔐 Admin Login</h2>

<input
id="adminEmail"
type="email"
placeholder="Admin Email"
>

<input
id="adminPassword"
type="password"
placeholder="Password"
>

<button onclick="login()">
Login
</button>

<div id="loginMessage"></div>

</div>


<!-- ADMIN PANEL -->

<div id="adminPanel" class="hidden">


<!-- DASHBOARD -->

<div class="stats">

<div class="stat new">

<h3 id="totalOrders">0</h3>

<p>📦 মোট অর্ডার</p>

</div>


<div class="stat new">

<h3 id="newOrders">0</h3>

<p>🆕 নতুন</p>

</div>


<div class="stat delivery">

<h3 id="deliveryOrders">0</h3>

<p>🚚 ডেলিভারি</p>

</div>


<div class="stat completed">

<h3 id="completedOrders">0</h3>

<p>✅ সম্পন্ন</p>

</div>

</div>


<!-- ORDER MANAGEMENT -->

<div class="card">

<h2>📦 অর্ডার ম্যানেজমেন্ট</h2>


<input
id="searchBox"
type="text"
placeholder="🔎 নাম / মোবাইল / অর্ডার নম্বর দিয়ে খুঁজুন"
oninput="filterOrders()"
>


<select
id="statusFilter"
onchange="filterOrders()"
>

<option value="সব">সব Status</option>

<option value="নতুন">নতুন</option>

<option value="প্রক্রিয়াধীন">প্রক্রিয়াধীন</option>

<option value="ডেলিভারি">ডেলিভারি</option>

<option value="সম্পন্ন">সম্পন্ন</option>

</select>


<button
class="refresh"
onclick="loadOrders()"
>
🔄 Refresh Orders
</button>


<button
class="logout"
onclick="logout()"
>
🚪 Logout
</button>


<div
id="orderCount"
class="orderCount"
>
</div>


<div id="orderArea">
⏳ অর্ডার লোড হচ্ছে...
</div>


</div>


</div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

const SUPABASE_URL =
"https://qstotlvpbygjsirqrpfj.supabase.co";


const SUPABASE_KEY =
"sb_publishable_8BctUmRxcq50smh4iiviuA_ouCGqobz";


const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


let allOrders = [];


/* LOGIN */

async function login(){

const email =
document
.getElementById("adminEmail")
.value
.trim();


const password =
document
.getElementById("adminPassword")
.value;


if(!email || !password){

document
.getElementById("loginMessage")
.innerText =
"Email এবং Password দিন।";

return;

}


const {data,error} =
await supabaseClient
.auth
.signInWithPassword({

email:email,

password:password

});


if(error){

document
.getElementById("loginMessage")
.innerText =
error.message;

return;

}


document
.getElementById("loginBox")
.classList
.add("hidden");


document
.getElementById("adminPanel")
.classList
.remove("hidden");


loadOrders();

}


/* LOGOUT */

async function logout(){

await supabaseClient
.auth
.signOut();

location.reload();

}


/* LOAD ORDERS */

async function loadOrders(){

const area =
document
.getElementById("orderArea");


area.innerHTML =
"⏳ অর্ডার লোড হচ্ছে...";


const {data,error} =
await supabaseClient

.from("orders")

.select("*")

.order(
"created_at",
{ascending:false}
);


if(error){

area.innerHTML =
"❌ অর্ডার লোড হয়নি: " +
error.message;

return;

}


allOrders =
data || [];


updateDashboard();


displayOrders(allOrders);

}


/* DASHBOARD */

function updateDashboard(){

const total =
allOrders.length;


const newCount =
allOrders.filter(
o => o.status === "নতুন"
).length;


const deliveryCount =
allOrders.filter(
o => o.status === "ডেলিভারি"
).length;


const completedCount =
allOrders.filter(
o => o.status === "সম্পন্ন"
).length;


document
.getElementById("totalOrders")
.innerText =
total;


document
.getElementById("newOrders")
.innerText =
newCount;


document
.getElementById("deliveryOrders")
.innerText =
deliveryCount;


document
.getElementById("completedOrders")
.innerText =
completedCount;

}


/* SEARCH + FILTER */

function filterOrders(){

const search =
document
.getElementById("searchBox")
.value
.toLowerCase()
.trim();


const status =
document
.getElementById("statusFilter")
.value;


const filtered =
allOrders.filter(order => {

const text = (

(order.order_no || "") +
" " +
(order.customer_name || "") +
" " +
(order.phone || "") +
" " +
(order.product || "") +
" " +
(order.type || "") +
" " +
(order.delivery_location || "")

).toLowerCase();


const searchMatch =
!search ||
text.includes(search);


const statusMatch =
status === "সব" ||
order.status === status;


return searchMatch && statusMatch;

});


displayOrders(filtered);

}


/* DISPLAY ORDERS */

function displayOrders(data){

const area =
document
.getElementById("orderArea");


document
.getElementById("orderCount")
.innerText =
"দেখানো হচ্ছে: " +
data.length +
" টি অর্ডার";


if(!data || data.length === 0){

area.innerHTML =
"📭 কোনো অর্ডার পাওয়া যায়নি।";

return;

}


let html = `

<div class="tableWrap">

<table>

<tr>

<th>Order</th>

<th>Date</th>

<th>Product</th>

<th>Type</th>

<th>Quantity</th>

<th>Location</th>

<th>Name</th>

<th>Phone</th>

<th>Status</th>
<th>Details</th>

</tr>

`;


data.forEach(order => {

html += `

<tr>

<td>
${order.order_no || ""}
</td>

<td>
${formatDate(order.created_at)}
</td>

<td>
${order.product || ""}
</td>

<td>
${order.type || ""}
</td>

<td>
${order.quantity || ""}
</td>

<td>
${order.delivery_location || ""}
</td>

<td>
${order.customer_name || ""}
</td>

<td>
${order.phone || ""}
</td>

<td>

<select
class="status"
onchange="changeStatus('${order.id}',this.value)"
>
<br>

<button
onclick="showOrderDetails('${order.id}')"
style="background:#6a1b9a;padding:7px 10px;font-size:13px;">
📋 Details
</button>

<option
${order.status === "নতুন" ? "selected" : ""}
value="নতুন">
নতুন
</option>

<option
${order.status === "প্রক্রিয়াধীন" ? "selected" : ""}
value="প্রক্রিয়াধীন">
প্রক্রিয়াধীন
</option>

<option
${order.status === "ডেলিভারি" ? "selected" : ""}
value="ডেলিভারি">
ডেলিভারি
</option>

<option
${order.status === "সম্পন্ন" ? "selected" : ""}
value="সম্পন্ন">
সম্পন্ন
</option>

</select>

</td>

</tr>

`;

});


html += `

</table>

</div>

`;


area.innerHTML =
html;

}


/* CHANGE STATUS */

async function changeStatus(id,status){

const {error} =
await supabaseClient

.from("orders")

.update({
status:status
})

.eq("id",id);


if(error){

alert(
"Status পরিবর্তন হয়নি: " +
error.message
);

return;

}


const order =
allOrders.find(
o => String(o.id) === String(id)
);


if(order){

order.status =
status;

}


updateDashboard();


filterOrders();

}

/* ORDER DETAILS */

function showOrderDetails(id){

const order = allOrders.find(
o => String(o.id) === String(id)
);

if(!order){

alert("অর্ডারের তথ্য পাওয়া যায়নি।");

return;

}

const phone =
(order.phone || "").replace(/\D/g,"");

const whatsapp =
phone.startsWith("0")
? "88" + phone
: phone;

let details =

"📦 M/S Rahima Traders\n\n" +

"অর্ডার নম্বর: " +
(order.order_no || "") +

"\n\nপণ্য: " +
(order.product || "") +

"\nসাইজ/ধরন: " +
(order.type || "") +

"\nপরিমাণ: " +
(order.quantity || "") +

"\nডেলিভারি স্থান: " +
(order.delivery_location || "") +

"\nক্রেতার নাম: " +
(order.customer_name || "") +

"\nমোবাইল: " +
(order.phone || "") +

"\nStatus: " +
(order.status || "") +

"\nঅতিরিক্ত তথ্য: " +
(order.message || "");

const action =
confirm(
details +
"\n\n📞 OK = Call\n💬 Cancel = WhatsApp"
);

if(action){

window.location.href =
"tel:" + (order.phone || "");

}else{

window.open(
"https://wa.me/" +
whatsapp +
"?text=" +
encodeURIComponent(details),
"_blank"
);

}

}
/* DATE */

function formatDate(date){

if(!date)
return "";

return new Date(date)
.toLocaleString("bn-BD");

}


/* CHECK SESSION */

async function checkSession(){

const {data} =
await supabaseClient
.auth
.getSession();


if(data.session){

document
.getElementById("loginBox")
.classList
.add("hidden");


document
.getElementById("adminPanel")
.classList
.remove("hidden");


loadOrders();

}

}


checkSession();

</script>

</body>
</html>
