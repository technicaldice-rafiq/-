<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>M/S Rahima Traders - Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f6f8;
  color:#222;
}

header{
  background:#075e54;
  color:white;
  padding:18px;
  text-align:center;
}

.container{
  max-width:1200px;
  margin:auto;
  padding:15px;
}

.card{
  background:white;
  padding:20px;
  border-radius:12px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
  margin-bottom:15px;
}

input,select,button{
  width:100%;
  padding:12px;
  margin:6px 0;
  border:1px solid #ccc;
  border-radius:7px;
  font-size:15px;
}

button{
  background:#075e54;
  color:white;
  border:none;
  cursor:pointer;
}

button:hover{
  opacity:.9;
}

.hidden{
  display:none !important;
}

.message{
  margin-top:10px;
  color:#d32f2f;
}

.dashboard{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
}

.stat{
  background:white;
  padding:15px;
  border-radius:10px;
  text-align:center;
  box-shadow:0 2px 6px rgba(0,0,0,.08);
}

.stat h2{
  margin:5px 0;
}

.controls{
  display:grid;
  grid-template-columns:2fr 1fr 120px;
  gap:10px;
}

.tableWrap{
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:950px;
}

th,td{
  border:1px solid #ddd;
  padding:9px;
  text-align:left;
  white-space:nowrap;
}

th{
  background:#075e54;
  color:white;
}

.status{
  width:auto;
  margin:0;
  padding:7px;
}

.logout{
  background:#c62828;
}

#orderCount{
  font-weight:bold;
  margin-bottom:10px;
}

@media(max-width:700px){

  .dashboard{
    grid-template-columns:repeat(2,1fr);
  }

  .controls{
    grid-template-columns:1fr;
  }

}
</style>
</head>

<body>

<header>
  <h2>🏪 M/S Rahima Traders</h2>
  <div>Admin Panel</div>
</header>

<div class="container">

<!-- LOGIN -->
<div id="loginBox" class="card">

  <h3>🔐 Admin Login</h3>

  <input
    type="email"
    id="adminEmail"
    placeholder="Admin Email"
  >

  <input
    type="password"
    id="adminPassword"
    placeholder="Password"
  >

  <button onclick="login()">Login</button>

  <div id="loginMessage" class="message"></div>

</div>


<!-- ADMIN PANEL -->
<div id="adminPanel" class="hidden">

  <div class="card">

    <button class="logout" onclick="logout()">
      🚪 Logout
    </button>

  </div>


  <!-- DASHBOARD -->
  <div class="dashboard">

    <div class="stat">
      <div>📦 মোট অর্ডার</div>
      <h2 id="totalOrders">0</h2>
    </div>

    <div class="stat">
      <div>🆕 নতুন</div>
      <h2 id="newOrders">0</h2>
    </div>

    <div class="stat">
      <div>🚚 ডেলিভারি</div>
      <h2 id="deliveryOrders">0</h2>
    </div>

    <div class="stat">
      <div>✅ সম্পন্ন</div>
      <h2 id="completedOrders">0</h2>
    </div>

  </div>


  <!-- SEARCH -->
  <div class="card">

    <h3>🔎 অর্ডার খুঁজুন</h3>

    <div class="controls">

      <input
        type="text"
        id="searchBox"
        placeholder="নাম / মোবাইল / Order No..."
        oninput="filterOrders()"
      >

      <select
        id="statusFilter"
        onchange="filterOrders()"
      >
        <option value="সব">সব Status</option>
        <option value="নতুন">নতুন</option>
        <option value="প্রক্রিয়াধীন">প্রক্রিয়াধীন</option>
        <option value="ডেলিভারি">ডেলিভারি</option>
        <option value="সম্পন্ন">সম্পন্ন</option>
      </select>

      <button onclick="loadOrders()">
        🔄 Refresh
      </button>

    </div>

  </div>


  <!-- ORDERS -->
  <div class="card">

    <h3>📋 অর্ডার তালিকা</h3>

    <div id="orderCount"></div>

    <div id="orderArea">
      ⏳ অর্ডার লোড হচ্ছে...
    </div>

  </div>

</div>

</div>


<script>

const SUPABASE_URL =
"https://qstotlvpbygjsirqrpfj.supabase.co";

const SUPABASE_KEY =
"sb_publishable_8BctUmRxcq50smh4iiviuA_ouCGqobz";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let allOrders = [];


async function login(){

  const email =
    document.getElementById("adminEmail").value.trim();

  const password =
    document.getElementById("adminPassword").value;

  if(!email || !password){

    document.getElementById("loginMessage").innerText =
      "Email এবং Password দিন।";

    return;
  }

  const {data,error} =
    await supabaseClient.auth.signInWithPassword({
      email:email,
      password:password
    });

  if(error){

    document.getElementById("loginMessage").innerText =
      error.message;

    return;
  }

  document.getElementById("loginBox")
    .classList.add("hidden");

  document.getElementById("adminPanel")
    .classList.remove("hidden");

  loadOrders();
}


async function logout(){

  await supabaseClient.auth.signOut();

  location.reload();

}


async function loadOrders(){

  const area =
    document.getElementById("orderArea");

  area.innerHTML =
    "⏳ অর্ডার লোড হচ্ছে...";


  const {data,error} =
    await supabaseClient
      .from("orders")
      .select("*")
      .order("created_at",{ascending:false});


  if(error){

    area.innerHTML =
      "❌ অর্ডার লোড হয়নি: " +
      error.message;

    return;
  }


  allOrders = data || [];

  updateDashboard();

  displayOrders(allOrders);

}


function updateDashboard(){

  const total =
    allOrders.length;

  const newCount =
    allOrders.filter(
      o => o.status === "নতুন"
    ).length;

  const deliveryCount =
    allOrders.filter(
      o => o.status === "ডেলিভারি"
    ).length;

  const completedCount =
    allOrders.filter(
      o => o.status === "সম্পন্ন"
    ).length;


  document.getElementById("totalOrders").innerText =
    total;

  document.getElementById("newOrders").innerText =
    newCount;

  document.getElementById("deliveryOrders").innerText =
    deliveryCount;

  document.getElementById("completedOrders").innerText =
    completedCount;

}


function filterOrders(){

  const search =
    document.getElementById("searchBox")
      .value
      .toLowerCase()
      .trim();

  const status =
    document.getElementById("statusFilter").value;


  const filtered =
    allOrders.filter(order => {

      const text =
        (
          (order.order_no || "") + " " +
          (order.customer_name || "") + " " +
          (order.phone || "") + " " +
          (order.product || "") + " " +
          (order.type || "") + " " +
          (order.delivery_location || "")
        ).toLowerCase();


      const searchMatch =
        !search ||
        text.includes(search);

      const statusMatch =
        status === "সব" ||
        order.status === status;


      return searchMatch && statusMatch;

    });


  displayOrders(filtered);
