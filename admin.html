<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>M/S Rahima Traders - Admin</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,"Noto Sans Bengali",sans-serif;
background:#f3f6f8;
color:#222
}

header{
background:#075e54;
color:white;
padding:20px;
text-align:center
}

header h1{margin:0;font-size:24px}

.container{
max-width:1100px;
margin:auto;
padding:15px
}

.card{
background:white;
padding:18px;
margin:15px 0;
border-radius:14px;
box-shadow:0 3px 12px rgba(0,0,0,.08)
}

input,select{
width:100%;
padding:12px;
margin:6px 0;
border:1px solid #ccc;
border-radius:8px;
font-size:16px
}

button{
padding:11px 15px;
border:0;
border-radius:8px;
background:#075e54;
color:white;
font-size:15px;
cursor:pointer;
margin:4px
}

.refresh{background:#1976d2}
.logout{background:#d32f2f}
.call{background:#388e3c}
.whatsapp{background:#25d366}
.details{background:#6a1b9a}
.close{background:#555}

.hidden{display:none}

#loginMessage{
color:#d32f2f;
margin-top:10px
}

.stats{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:12px
}

.stat{
background:white;
padding:18px;
border-radius:12px;
text-align:center;
box-shadow:0 3px 10px rgba(0,0,0,.07)
}

.stat h3{
margin:5px 0;
font-size:28px
}

.stat p{
margin:0;
font-weight:bold
}

.new{border-top:5px solid #ff9800}
.delivery{border-top:5px solid #9c27b0}
.completed{border-top:5px solid #4caf50}

.tableWrap{overflow-x:auto}

table{
width:100%;
border-collapse:collapse;
margin-top:15px;
font-size:14px;
min-width:1100px
}

th,td{
border:1px solid #ddd;
padding:9px;
text-align:left
}

th{
background:#075e54;
color:white
}

.status{
padding:7px;
margin:0
}

.modal{
position:fixed;
left:0;
top:0;
width:100%;
height:100%;
background:rgba(0,0,0,.6);
display:flex;
align-items:center;
justify-content:center;
padding:15px;
z-index:1000
}

.modalBox{
background:white;
width:100%;
max-width:550px;
max-height:90vh;
overflow:auto;
border-radius:15px;
padding:20px
}

.modalBox h2{
margin-top:0;
color:#075e54
}

.detailRow{
padding:9px 0;
border-bottom:1px solid #eee
}

.detailRow b{
display:inline-block;
min-width:130px
}

#newAlert{
background:#fff3cd;
color:#856404;
padding:12px;
border-radius:8px;
margin-bottom:12px;
display:none
}

@media(max-width:700px){

.stats{
grid-template-columns:repeat(2,1fr)
}

.stat h3{
font-size:23px
}

header h1{
font-size:20px
}

button{
width:100%;
margin:4px 0
}
}
</style>
</head>

<body>

<header>
<h1>🔐 M/S Rahima Traders</h1>
<p>Admin Dashboard</p>
</header>

<div class="container">

<!-- LOGIN -->

<div id="loginBox" class="card">

<h2>🔐 Admin Login</h2>

<input id="adminEmail"
type="email"
placeholder="Admin Email">

<input id="adminPassword"
type="password"
placeholder="Password">

<button onclick="login()">Login</button>

<div id="loginMessage"></div>

</div>


<!-- ADMIN -->

<div id="adminPanel" class="hidden">

<div class="stats">

<div class="stat new">
<h3 id="totalOrders">0</h3>
<p>📦 মোট অর্ডার</p>
</div>

<div class="stat new">
<h3 id="newOrders">0</h3>
<p>🆕 নতুন</p>
</div>

<div class="stat delivery">
<h3 id="deliveryOrders">0</h3>
<p>🚚 ডেলিভারি</p>
</div>

<div class="stat completed">
<h3 id="completedOrders">0</h3>
<p>✅ সম্পন্ন</p>
</div>

</div>


<div class="card">

<div id="newAlert">
🔔 নতুন অর্ডার এসেছে!
</div>

<h2>📦 অর্ডার ম্যানেজমেন্ট</h2>

<input
id="searchBox"
type="text"
placeholder="🔎 নাম / মোবাইল / অর্ডার নম্বর"
oninput="filterOrders()">

<select id="statusFilter"
onchange="filterOrders()">

<option value="সব">সব Status</option>
<option value="নতুন">নতুন</option>
<option value="প্রক্রিয়াধীন">প্রক্রিয়াধীন</option>
<option value="ডেলিভারি">ডেলিভারি</option>
<option value="সম্পন্ন">সম্পন্ন</option>

</select>

<button class="refresh"
onclick="loadOrders()">
🔄 Refresh
</button>

<button class="logout"
onclick="logout()">
🚪 Logout
</button>

<div id="orderCount"></div>

<div id="orderArea">
⏳ অর্ডার লোড হচ্ছে...
</div>

</div>

</div>

</div>


<!-- DETAILS MODAL -->

<div id="detailsModal"
class="modal hidden">

<div class="modalBox">

<h2>📋 Order Details</h2>

<div id="detailsContent"></div>

<button class="close"
onclick="closeDetails()">
বন্ধ করুন
</button>

</div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://qstotlvpbygjsirqrpfj.supabase.co";

const SUPABASE_KEY =
"sb_publishable_8BctUmRxcq50smh4iiviuA_ouCGqobz";

const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

let allOrders=[];

let previousOrderCount=0;


/* LOGIN */

async function login(){

const email=
document.getElementById("adminEmail")
.value.trim();

const password=
document.getElementById("adminPassword")
.value;

if(!email || !password){

document.getElementById("loginMessage")
.innerText=
"Email এবং Password দিন।";

return;
}

const {data,error}=
await supabaseClient.auth
.signInWithPassword({
email:email,
password:password
});

if(error){

document.getElementById("loginMessage")
.innerText=
error.message;

return;
}

document.getElementById("loginBox")
.classList.add("hidden");

document.getElementById("adminPanel")
.classList.remove("hidden");

loadOrders();

}


/* LOGOUT */

async function logout(){

await supabaseClient.auth.signOut();

location.reload();

}


/* LOAD ORDERS */

async function loadOrders(){

const area=
document.getElementById("orderArea");

area.innerHTML=
"⏳ অর্ডার লোড হচ্ছে...";

const {data,error}=
await supabaseClient
.from("orders")
.select("*")
.order("created_at",
{ascending:false});

if(error){

area.innerHTML=
"❌ অর্ডার লোড হয়নি: "+
error.message;

return;
}

const newCount=data.length;

if(previousOrderCount>0 &&
newCount>previousOrderCount){

document.getElementById("newAlert")
.style.display="block";

alert("🔔 নতুন অর্ডার এসেছে!");

}

previousOrderCount=newCount;

allOrders=data||[];

updateDashboard();

displayOrders(allOrders);

}


/* DASHBOARD */

function updateDashboard(){

document.getElementById("totalOrders")
.innerText=
allOrders.length;

document.getElementById("newOrders")
.innerText=
allOrders.filter(
o=>o.status==="নতুন"
).length;

document.getElementById("deliveryOrders")
.innerText=
allOrders.filter(
o=>o.status==="ডেলিভারি"
).length;

document.getElementById("completedOrders")
.innerText=
allOrders.filter(
o=>o.status==="সম্পন্ন"
).length;

}


/* SEARCH */

function filterOrders(){

const search=
document.getElementById("searchBox")
.value.toLowerCase()
.trim();

const status=
document.getElementById("statusFilter")
.value;

const filtered=
allOrders.filter(order=>{

const text=(

(order.order_no||"")+" "+
(order.customer_name||"")+" "+
(order.phone||"")+" "+
(order.product||"")+" "+
(order.type||"")+" "+
(order.delivery_location||"")

).toLowerCase();

return
(!search || text.includes(search)) &&
(status==="সব" || order.status===status);

});

displayOrders(filtered);

}


/* DISPLAY */

function displayOrders(data){

const area=
document.getElementById("orderArea");

document.getElementById("orderCount")
.innerText=
"দেখানো হচ্ছে: "+
data.length+
" টি অর্ডার";

if(!data.length){

area.innerHTML=
"📭 কোনো অর্ডার পাওয়া যায়নি।";

return;
}

let html=`

<div class="tableWrap">

<table>

<tr>

<th>Order</th>
<th>Date</th>
<th>Product</th>
<th>Type</th>
<th>Quantity</th>
<th>Location</th>
<th>Name</th>
<th>Phone</th>
<th>Status</th>
<th>Details</th>

</tr>
`;

data.forEach(order=>{

html+=`

<tr>

<td>${safe(order.order_no)}</td>

<td>${formatDate(order.created_at)}</td>

<td>${safe(order.product)}</td>

<td>${safe(order.type)}</td>

<td>${safe(order.quantity)}</td>

<td>${safe(order.delivery_location)}</td>

<td>${safe(order.customer_name)}</td>

<td>${safe(order.phone)}</td>

<td>

<select
class="status"
onchange="changeStatus('${order.id}',this.value)">

<option
${order.status==="নতুন"?"selected":""}
value="নতুন">
নতুন
</option>

<option
${order.status==="প্রক্রিয়াধীন"?"selected":""}
value="প্রক্রিয়াধীন">
প্রক্রিয়াধীন
</option>

<option
${order.status==="ডেলিভারি"?"selected":""}
value="ডেলিভারি">
ডেলিভারি
</option>

<option
${order.status==="সম্পন্ন"?"selected":""}
value="সম্পন্ন">
সম্পন্ন
</option>

</select>

</td>

<td>

<button
class="details"
onclick="showDetails('${order.id}')">
📋 Details
</button>

</td>

</tr>

`;

});

html+=`

</table>

</div>
`;

area.innerHTML=html;

}


/* DETAILS */

function showDetails(id){

const order=
allOrders.find(
o=>String(o.id)===String(id)
);

if(!order)return;

const phone=
(order.phone||"")
.replace(/\D/g,"");

const whatsapp=
phone.startsWith("0")
?"88"+phone
:phone;

let html=`

<div class="detailRow">
<b>অর্ডার:</b>
${safe(order.order_no)}
</div>

<div class="detailRow">
<b>তারিখ:</b>
${formatDate(order.created_at)}
</div>

<div class="detailRow">
<b>পণ্য:</b>
${safe(order.product)}
</div>

<div class="detailRow">
<b>সাইজ/ধরন:</b>
${safe(order.type)}
</div>

<div class="detailRow">
<b>পরিমাণ:</b>
${safe(order.quantity)}
</div>

<div class="detailRow">
<b>ডেলিভারি:</b>
${safe(order.delivery_location)}
</div>

<div class="detailRow">
<b>ক্রেতার নাম:</b>
${safe(order.customer_name)}
</div>

<div class="detailRow">
<b>মোবাইল:</b>
${safe(order.phone)}
</div>

<div class="detailRow">
<b>Status:</b>
${safe(order.status)}
</div>

<div class="detailRow">
<b>অতিরিক্ত তথ্য:</b>
${safe(order.message)}
</div>

<br>

<a href="tel:${safe(order.phone)}">
<button class="call">
📞 Call Customer
</button>
</a>

<a
href="https://wa.me/${whatsapp}"
target="_blank">

<button class="whatsapp">
💬 WhatsApp Customer
</button>

</a>

`;

document.getElementById("detailsContent")
.innerHTML=html;

document.getElementById("detailsModal")
.classList.remove("hidden");

}


/* CLOSE DETAILS */

function closeDetails(){

document.getElementById("detailsModal")
.classList.add("hidden");

}


/* STATUS */

async function changeStatus(id,status){

const {error}=
await supabaseClient
.from("orders")
.update({status:status})
.eq("id",id);

if(error){

alert(
"Status পরিবর্তন হয়নি: "+
error.message
);

return;
}

const order=
allOrders.find(
o=>String(o.id)===String(id)
);

if(order)
order.status=status;

updateDashboard();

filterOrders();

}


/* DATE */

function formatDate(date){

if(!date)return "";

return new Date(date)
.toLocaleString("bn-BD");

}


/* SAFE TEXT */

function safe(value){

if(value===null ||
value===undefined)
return "";

return String(value)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* SESSION */

async function checkSession(){

const {data}=
await supabaseClient.auth
.getSession();

if(data.session){

document.getElementById("loginBox")
.classList.add("hidden");

document.getElementById("adminPanel")
.classList.remove("hidden");

loadOrders();

}

}

checkSession();

if(!document
